spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/condominio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.security.cookie-secure=${COOKIE_SECURE:true}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
